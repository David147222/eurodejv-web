# Zkušební verze nového webu na GitHub Pages: https://david147222.github.io/eurodejv-web/
# Po každé změně v main se sestaví a zveřejní. Je skrytá před vyhledávači a formulář nic neodesílá.
# Jednou je potřeba zapnout Pages: Settings → Pages → Source: GitHub Actions.
name: Zkušební web (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nainstalovat ImageMagick (zmenšování fotek)
        run: sudo apt-get install -y -q imagemagick >/dev/null
      - name: Sestavit zkušební web
        run: node build.js
        env:
          ZKUSEBNI: 1
          BASE: /eurodejv-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
